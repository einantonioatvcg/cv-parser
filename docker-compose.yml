services:
  api:
    build: .
    user: "1000:1000"
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./:/app
    env_file:
      - path: .env
        required: false
    environment:
      CV_PARSER_CORS_ORIGINS: "http://localhost:3000"
    command: uvicorn cv_parser.api:app --host 0.0.0.0 --port 8010 --reload --app-dir src
